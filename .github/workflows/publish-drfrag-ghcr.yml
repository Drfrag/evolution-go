name: Publish Drfrag Evolution Go

on:
  workflow_run:
    workflows:
      - Validate Drfrag Evolution Go
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: drfrag-evolution-go-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Read application version
        id: version
        shell: bash
        run: |
          VERSION="$(cat VERSION 2>/dev/null | tr -d '\r\n' || true)"
          if [ -z "$VERSION" ]; then VERSION="integrated-0a4b9ff"; fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/drfrag/evolution-go
          tags: |
            type=sha,format=short
            type=raw,value=${{ steps.version.outputs.value }}
            type=raw,value=latest
      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - name: Publication summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          echo "### Drfrag Evolution Go published after validation" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: ghcr.io/drfrag/evolution-go" >> "$GITHUB_STEP_SUMMARY"
          echo "Platforms: linux/amd64, linux/arm64" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: $DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo "Validated commit: $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
