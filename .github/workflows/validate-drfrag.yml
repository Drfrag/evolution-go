name: Validate Drfrag Evolution Go

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: drfrag-evolution-go-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-go:
    name: Go tests, vet, race detector, and WhatsApp QR
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libjpeg-dev libwebp-dev
      - name: Test all packages
        run: go test ./...
      - name: Vet all packages
        run: go vet ./...
      - name: Race-test all packages
        run: go test -race ./...
      - name: Build server
        run: go build -o "${RUNNER_TEMP}/evolution-go" ./cmd/evolution-go
      - name: Exercise real WhatsApp protocol until QR
        env:
          EVOLUTION_GO_WA_INTEGRATION: '1'
        run: |
          mkdir -p evidence/ci
          go test ./pkg/whatsmeow/service \
            -run '^TestIntegrationDynamicVersionReachesRealWhatsmeowQR$' \
            -count=1 -v 2>&1 | tee evidence/ci/real-whatsmeow-qr.log
      - name: Upload protocol evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-whatsmeow-qr-${{ github.run_id }}
          path: evidence/ci/real-whatsmeow-qr.log
          if-no-files-found: warn
          retention-days: 7

  image-gates:
    name: Runtime image smoke and vulnerability scan
    needs: verify-go
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build AMD64 release candidate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: local/evolution-go:validation-${{ github.sha }}
          build-args: VERSION=validation-${{ github.sha }}
          cache-from: type=gha
      - name: Smoke PostgreSQL, Redis, and API readiness
        env:
          E2E_IMAGE: local/evolution-go:validation-${{ github.sha }}
          E2E_ARTIFACT_DIR: ${{ runner.temp }}/evolution-go-runtime
        run: ./docker/ci/smoke-runtime.sh
      - name: Upload sanitized runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-smoke-sanitized-${{ github.run_id }}
          path: ${{ runner.temp }}/evolution-go-runtime/
          if-no-files-found: warn
          retention-days: 7
      - name: Scan release candidate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: local/evolution-go:validation-${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
